name: Android Build

# DIAGNOSTIC variant (temporary): compile FIRST, test SECOND, and capture
# both steps' full console output as downloadable artifacts. The current
# workflow runs the tests before the build, so a test-step failure hides
# whether the app even compiles. This file answers that in a single run:
#   - if "Build debug APK" fails, the problem is compilation (KSP / Room /
#     Hilt validation / a Kotlin error) — read build-compile.log.
#   - if the build passes but "Run unit tests" fails, the problem is test
#     execution (Robolectric android-all download / a test assertion) —
#     read build-test.log.
# Paste this WHOLE file OVER .github/workflows/android.yml in the repo
# (GitHub web UI: repo -> .github/workflows/android.yml -> Edit (pencil) ->
# select all -> paste -> Commit changes). Do NOT create a second workflow
# file — there must be exactly one workflow, at .github/workflows/android.yml.
# The file is named android-diagnostic.yml here only so it does not collide
# with the project's android-build.yml; the repo keeps the name android.yml.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # gradlew loses its executable bit when the project is pushed from
      # Windows (repo mode 100644 instead of 100755) — that alone failed
      # CI runs #1 and #2 with exit code 126 before Gradle even started.
      # Restoring the bit here makes the build independent of the stored mode.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ubuntu-latest runners ship an Android SDK, but the exact packages are
      # not guaranteed, so install the API level and build-tools this project
      # needs (compileSdk 34) explicitly.
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null <<'EOF'
          y
          y
          y
          y
          y
          y
          EOF
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      # Official Gradle action: dependency + wrapper caching, no extra config.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # --- DIAGNOSTIC STEP 1: compile first, before any test ------------
      # Runs before the tests so a compile failure shows up on its own.
      # Full console output is teed to build-compile.log; `set -o pipefail`
      # keeps the step red when Gradle fails (plain `tee` would mask it).
      # --console=plain keeps the log readable (no progress-bar control codes).
      - name: Build debug APK (compile first)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build-compile.log

      # --- DIAGNOSTIC STEP 2: tests (only if the compile passed) ---------
      # Skipped automatically when the compile fails — that is the point:
      # a red run whose failing step is this one means the failure is in
      # test execution, not in compilation.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build-test.log

      # Test HTML/XML reports are only useful when tests fail — upload them
      # then, so a red run still tells you exactly which test broke.
      - name: Upload test reports (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hangulmate-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/

      # The two log files are the diagnostic payload: they hold the exact
      # error text of whichever step failed. Uploaded on EVERY run (not
      # just on failure) so the compile log is there even when the build
      # step fails and the APK upload below is skipped. Download them from
      # the run page (Actions -> the run -> Artifacts -> hangulmate-build-logs)
      # and paste the error lines back here — this is the way to read the
      # failure text without opening the sign-in-walled step log.
      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hangulmate-build-logs
          path: |
            build-compile.log
            build-test.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hangulmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
